[General]
# Flameshot 14+ uses XDG Desktop Portal for screenshots by default, even on X11.
# Minimal X11 WMs such as BSPWM commonly do not have a portal backend that
# implements the Screenshot interface. Force Flameshot's native X11 capture
# path so Print/Shift+Print/Ctrl+Print work reliably in the KaliPWM BSPWM session.
useX11LegacyScreenshot=true
