# KaliPWM V1 — Obsidian Tactical Picom configuration
# Deliberately restrained: small corners, soft shadows, readable opacity.

backend = "glx";
vsync = true;
use-damage = true;

# Corners
corner-radius = 9;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'flameshot'"
];

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.32;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'flameshot'",
  "class_g = 'firefox' && argb"
];

# Fading
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 8;

# Keep working windows readable. Transparency is supplied intentionally by
# applications such as Kitty instead of dimming every inactive window.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Background blur for transparent surfaces.
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'flameshot'"
];

# General X11 behavior
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
