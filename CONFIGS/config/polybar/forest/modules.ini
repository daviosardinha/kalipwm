; KaliPWM V1 — core Polybar modules
; Hardware-specific values are intentionally implemented as dynamic scripts in
; user_modules.ini instead of hard-coding BAT0, ADP1, wlan0, tun0 or hwmon paths.

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>

label-active = %name%
label-active-foreground = ${color.background}
label-active-background = ${color.accent}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${color.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${color.foreground-muted}
label-empty-padding = 1

label-urgent = %name%
label-urgent-foreground = ${color.white}
label-urgent-background = ${color.critical}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 30
date = %d/%m/%y
time = %H:%M
date-alt = %A, %d %B %Y
time-alt = %H:%M:%S
format = <label>
label = %time%
label-foreground = ${color.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU %percentage%%
label-foreground = ${color.foreground-muted}

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = RAM %percentage_used%%
label-foreground = ${color.foreground-muted}
