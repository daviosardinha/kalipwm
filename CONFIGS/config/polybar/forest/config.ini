; KaliPWM V1 — Obsidian Tactical Polybar

[global/wm]
margin-top = 0
margin-bottom = 0

include-file = ~/.config/polybar/forest/colors.ini
include-file = ~/.config/polybar/forest/modules.ini
include-file = ~/.config/polybar/forest/user_modules.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true

width = 100%
height = 38
offset-x = 0
offset-y = 0

background = ${color.background}
foreground = ${color.foreground}

radius = 0
line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "Hack Nerd Font:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=10;3"
font-2 = "Hack Nerd Font:size=12;3"

modules-left = launcher workspaces
modules-center = target
modules-right = system-profile sep telemetry sep network-status vpn-status battery-status sep date sep sysmenu

separator =
dim-value = 1.0
locale =
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

; Let Polybar use the X server/Xft DPI by default. This avoids baking a
; 1920x1080 assumption into high-DPI laptop or VM sessions.
dpi = 0

[settings]
screenchange-reload = true
pseudo-transparency = false
throttle-output = 5
throttle-output-for = 10
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
