include-file = ~/.config/polybar/obsidian/colors.ini
include-file = ~/.config/polybar/obsidian/icons.ini
include-file = ~/.config/polybar/obsidian/modules.ini

[bar/main]
width = 100%
height = 34
radius = 0
fixed-center = true
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 1
border-bottom-color = ${colors.border}
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "Hack Nerd Font:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=10;3"

modules-left = launcher wifi ethernet vpn target
modules-center = workspaces
modules-right = gpu cpu memory audio thermal fan ac battery date sysmenu

separator =
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

[settings]
screenchange-reload = true
pseudo-transparency = false
