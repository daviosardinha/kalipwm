[module/launcher]
type = custom/text
format = ${icons.launcher}
format-foreground = ${colors.violet-bright}
click-left = ~/.config/polybar/obsidian/scripts/launcher.sh &

[module/wifi]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/wifi.sh
interval = 3
format-prefix = ${icons.wifi}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/ethernet]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/ethernet.sh
interval = 3
format-prefix = ${icons.ethernet}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/vpn]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/vpn.sh
interval = 2
format-prefix = ${icons.vpn}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/target]
type = custom/script
exec = /usr/local/bin/target --display
interval = 2
format-prefix = ${icons.target}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/workspaces]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.violet-bright}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.foreground-muted}
label-empty-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/gpu]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/gpu.sh
interval = 2
format-prefix = ${icons.gpu}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = ${icons.cpu}
format-prefix-foreground = ${colors.violet}
label = " %percentage%%"

[module/memory]
type = internal/memory
interval = 2
format-prefix = ${icons.memory}
format-prefix-foreground = ${colors.violet}
label = " %mb_used%"

[module/audio]
type = internal/pulseaudio
interval = 2
format-volume-prefix = ${icons.audio}
format-volume-prefix-foreground = ${colors.violet}
label-volume = " %percentage%%"
format-muted-prefix = ${icons.audio-muted}
format-muted-prefix-foreground = ${colors.red}
label-muted = " MUTED"
click-right = pavucontrol &

[module/thermal]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/thermal.sh
interval = 3
format-prefix = ${icons.thermal}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/fan]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/fan.sh
interval = 3
format-prefix = ${icons.fan}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/ac]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/ac.sh
interval = 5
format-prefix = ${icons.ac}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/battery]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/battery.sh
interval = 5
format-prefix = ${icons.battery}
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/date]
type = internal/date
interval = 30
time = %H:%M
date = %d/%m/%y
format-prefix = ${icons.clock}
format-prefix-foreground = ${colors.violet}
label = " %time% - %date%"

[module/sysmenu]
type = custom/text
format = ${icons.power}
format-foreground = ${colors.violet-bright}
click-left = ~/.config/polybar/obsidian/scripts/powermenu.sh &
