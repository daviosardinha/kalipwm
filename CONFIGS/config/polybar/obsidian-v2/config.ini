include-file = ~/.config/polybar/obsidian-v2/colors.ini
include-file = ~/.config/polybar/obsidian-v2/icons.ini
include-file = ~/.config/polybar/obsidian-v2/modules.ini

[bar/main]
width = 100%
height = 48
radius = 0
fixed-center = true
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-bottom-size = 2
border-bottom-color = ${colors.border}
padding-left = 2
padding-right = 2
module-margin-left = 0
module-margin-right = 1

font-0 = "Hack Nerd Font:size=13;4"
font-1 = "JetBrainsMono Nerd Font:size=12;4"
font-2 = "JetBrainsMono Nerd Font:style=Bold:size=12;4"
font-3 = "Hack Nerd Font:size=15;4"

modules-left = launcher wifi vpn target
modules-center = workspaces
modules-right = cpu gpu memory fan audio power date sysmenu

separator =
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

[settings]
screenchange-reload = true
pseudo-transparency = false
