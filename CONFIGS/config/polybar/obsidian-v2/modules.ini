[module/launcher]
type = custom/text
format = ${icons.launcher}
format-font = 4
format-foreground = ${colors.violet-bright}
format-padding = 1
click-left = ~/.config/polybar/obsidian/scripts/launcher.sh &

[module/wifi]
type = custom/script
exec = ~/.config/polybar/obsidian/scripts/wifi.sh
interval = 3
format-prefix = ${icons.wifi}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/vpn]
type = custom/script
exec = ~/.config/polybar/obsidian-v2/scripts/vpn-compact.sh
interval = 2
format-prefix = ${icons.vpn}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
format-margin = 32px
label = " %output%"

[module/target]
type = custom/script
exec = /usr/bin/target --display
interval = 2
format-prefix = ${icons.target}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/workspaces]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = false
format = <label-state>

label-focused = %name%
label-focused-font = 2
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.violet-bright}
label-focused-padding = 2

label-occupied = %name%
label-occupied-font = 1
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-font = 1
label-empty-foreground = ${colors.foreground-muted}
label-empty-padding = 1

label-urgent = %name%
label-urgent-font = 2
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/cpu]
type = custom/script
exec = ~/.config/polybar/obsidian-v2/scripts/cpu-compact.sh
interval = 2
format-prefix = ${icons.cpu}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/gpu]
type = custom/script
exec = ~/.config/polybar/obsidian-v2/scripts/gpu-compact.sh
interval = 2
format-prefix = ${icons.gpu}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " %output%"

[module/fan]
type = custom/script
exec = ~/.config/polybar/obsidian-v2/scripts/fan-compact.sh
interval = 3
format-prefix = ${icons.fan}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " FAN %output%"
label-foreground = ${colors.foreground}

[module/memory]
type = custom/script
exec = ~/.config/polybar/obsidian-v2/scripts/memory-compact.sh
interval = 3
format-prefix = ${icons.memory}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " RAM %output%"

[module/audio]
type = internal/pulseaudio
interval = 2
format-volume-prefix = ${icons.audio}
format-volume-prefix-font = 4
format-volume-prefix-foreground = ${colors.violet}
label-volume = " %percentage%%"
format-muted-prefix = ${icons.audio-muted}
format-muted-prefix-font = 4
format-muted-prefix-foreground = ${colors.red}
label-muted = " MUTED"
click-right = pavucontrol &

[module/power]
type = custom/script
exec = ~/.config/polybar/obsidian-v2/scripts/power-compact.sh
interval = 5
label = %output%

[module/date]
type = internal/date
interval = 30
date =
time = %H:%M
date-alt = %d/%m/%y
time-alt = %H:%M
format-prefix = ${icons.clock}
format-prefix-font = 4
format-prefix-foreground = ${colors.violet}
label = " %time% %date%"

[module/sysmenu]
type = custom/text
format = ${icons.power}
format-font = 4
format-foreground = ${colors.violet-bright}
click-left = ~/.config/polybar/obsidian/scripts/powermenu.sh &
