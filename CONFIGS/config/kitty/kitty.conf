# KaliPWM V1 — Kitty
include color.ini

font_family JetBrainsMono Nerd Font
font_size 13.5
disable_ligatures never

window_padding_width 8
background_opacity 0.94
dynamic_background_opacity yes

cursor_shape beam
cursor_beam_thickness 1.6

mouse_hide_wait 3.0
detect_urls yes
url_style curly

enable_audio_bell no
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Window/tab workflow
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+z toggle_layout stack
tab_bar_style powerline
tab_powerline_style slanted

# Preserve the upstream named copy buffers.
map F1 copy_to_buffer a
map F2 paste_from_buffer a
map F3 copy_to_buffer b
map F4 paste_from_buffer b

# Familiar shell navigation
map ctrl+left send_text all \x1b\x62
map ctrl+right send_text all \x1b\x66
map alt+left send_text all \x01
map alt+right send_text all \x05

shell zsh
