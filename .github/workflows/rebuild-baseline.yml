name: V1 rebuild baseline guard

on:
  push:
    branches:
      - v1/rebuild-from-upstream
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preserve-upstream-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected upstream desktop files remain untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=187eefe3108040f8d0f1164804ac3f0267113604
          git diff --exit-code "$BASE" -- \
            CONFIGS/config/bspwm \
            CONFIGS/config/picom \
            CONFIGS/config/polybar \
            CONFIGS/config/kitty \
            CONFIGS/config/rofi

      - name: Verify sxhkd only contains approved screenshot and media-key deltas
        shell: bash
        run: bash tests/sxhkd-media-bindings.sh

      - name: Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n kalipwm.sh
          if [[ -f install.sh ]]; then
            bash -n install.sh
          fi
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find SCRIPTS -maxdepth 1 -type f -print | sort)

      - name: Profile generation regression test
        shell: bash
        run: bash tests/profile-generation.sh

      - name: Operator context regression test
        shell: bash
        run: bash tests/operator-context.sh

      - name: Network and battery regression test
        shell: bash
        run: bash tests/network-battery.sh

      - name: Audio brightness and OSD regression test
        shell: bash
        run: bash tests/audio-brightness-osd.sh

      - name: Flameshot screenshot regression test
        shell: bash
        run: bash tests/screenshot-flameshot.sh

      - name: Polybar operator overlay regression test
        shell: bash
        run: bash tests/polybar-operator-overlay.sh

      - name: Thermal telemetry regression test
        shell: bash
        run: bash tests/telemetry.sh

      - name: Conservative display planning regression test
        shell: bash
        run: bash tests/display-plan.sh

      - name: Obsidian Tactical visual overlay regression test
        shell: bash
        run: bash tests/obsidian-theme.sh
