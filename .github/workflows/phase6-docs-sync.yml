name: Phase 6 documentation sync

on:
  push:
    branches:
      - feature/security-maintainability-shell-quality
    paths:
      - .github/workflows/phase6-docs-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README, roadmap and changelog
        run: echo '' | base64 -d | python3

      - name: Commit documentation
        run: |
          if git diff --quiet -- README.md ROADMAP.md CHANGELOG.md; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CHANGELOG.md
          git commit -m "docs: complete phase 6 security and maintainability"
          git push origin HEAD:feature/security-maintainability-shell-quality
