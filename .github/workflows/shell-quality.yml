name: Shell quality

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run maintained-shell audit
        run: bash SCRIPTS/kalipwm-shell-quality

      - name: Guard validated brightness architecture
        run: bash tests/brightness-regression.sh

      - name: Validate installer failure reporting
        run: bash tests/installer-failure-handling.sh

      - name: Validate external dependency lock
        run: bash tests/dependency-lock.sh
