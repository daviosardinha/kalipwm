name: V1 static checks

on:
  push:
    branches:
      - main
      - 'v1/**'
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run KaliPWM static checks
        run: bash tests/static-checks.sh

      - name: Run upstream compatibility checks
        run: bash tests/upstream-compat-checks.sh

      - name: Run runtime regression checks
        run: bash tests/runtime-regression-checks.sh

      - name: Run display resume fail-safe guard
        run: bash tests/display-resume-guard.sh
